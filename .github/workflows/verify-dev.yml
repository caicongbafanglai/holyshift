name: Verify dev production build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holy-shift-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out dev source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use locked Node.js toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint, test, and build
        env:
          VITE_HOLYSHIFT_COMMIT: ${{ github.sha }}
        run: npm run check

      - name: Prepare release evidence
        if: always()
        run: |
          mkdir -p release-evidence
          node --version > release-evidence/toolchain.txt
          npm --version >> release-evidence/toolchain.txt
          git rev-parse HEAD > release-evidence/source-commit.txt

      - name: Audit production and development dependencies
        run: npm audit --audit-level=low --json > release-evidence/npm-audit.json

      - name: Record artifact manifest and production SBOM
        run: |
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > release-evidence/SHA256SUMS
          npm sbom --omit=dev --sbom-format=spdx > release-evidence/sbom.spdx.json

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Verify Chromium and WebKit production gameplay
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/cross-browser
          PLAYWRIGHT_TEST_OUTPUT_DIR: test-results/cross-browser
        run: npx playwright test --project=chromium --project=webkit --workers=1

      - name: Verify Firefox production gameplay with WebGL
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/firefox
          PLAYWRIGHT_TEST_OUTPUT_DIR: test-results/firefox
        run: xvfb-run -a env PW_FIREFOX_HEADED=1 npx playwright test --project=firefox --workers=1

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holy-shift-browser-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 90

      - name: Upload verified static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holy-shift-dev-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 90

      - name: Upload release manifest and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holy-shift-release-evidence-${{ github.sha }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 90
