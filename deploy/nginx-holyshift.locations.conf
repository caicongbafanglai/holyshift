# Include these locations inside the qt.fengche.ai Nginx server block.

location = /holyshift {
    return 301 https://$host/holyshift/$is_args$args;
}

location /holyshift/assets/ {
    alias /home/ubuntu/holyshift/dist/assets/;
    access_log off;
    expires 1y;
    gzip on;
    gzip_types text/css application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
}

location /holyshift/ {
    alias /home/ubuntu/holyshift/dist/;
    index index.html;
    add_header Cache-Control "public, no-cache, max-age=0, must-revalidate, no-transform" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; worker-src 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri $uri/ /holyshift/index.html;
}
