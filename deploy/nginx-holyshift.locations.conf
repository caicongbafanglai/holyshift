# Include these locations only inside the HTTPS qt.fengche.ai server block.
# The active artifact must be a root-owned, atomically switched release at
# /srv/holyshift/current. A developer working tree must never be the web root.

location = /holyshift {
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 308 /holyshift/$is_args$args;
}

location = /holyshift/ {
    alias /srv/holyshift/current/;
    try_files index.html =404;
    add_header Cache-Control "public, no-cache, max-age=0, must-revalidate, no-transform" always;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; worker-src 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
}

location = /holyshift/favicon.svg {
    alias /srv/holyshift/current/favicon.svg;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

location ^~ /holyshift/assets/ {
    # Hashed assets are append-only so an old HTML response remains loadable
    # across a release switch or rollback.
    alias /srv/holyshift/assets/;
    access_log off;
    expires 1y;
    gzip on;
    gzip_types text/css application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
}

location /holyshift/ {
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    return 404;
}
